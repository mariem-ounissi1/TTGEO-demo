<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Inscription')}"></head>
<body class="bg-light">
<div class="container" style="max-width:420px; margin-top:60px">
  <div class="card shadow-sm"><div class="card-body">
    <h3 class="mb-3 text-center">Inscription</h3>
    <form th:action="@{/register}" th:object="${user}" method="post">
      <div class="mb-3"><label class="form-label">Nom</label>
        <input th:field="*{nom}" class="form-control">
        <div class="text-danger small" th:if="${#fields.hasErrors('nom')}" th:errors="*{nom}"></div></div>
      <div class="mb-3"><label class="form-label">Email</label>
        <input th:field="*{email}" class="form-control">
        <div class="text-danger small" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div></div>
      <div class="mb-3"><label class="form-label">Mot de passe</label>
        <input type="password" th:field="*{password}" class="form-control">
        <div class="text-danger small" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div></div>
      <button class="btn btn-primary w-100">S'inscrire</button>
    </form>
    <p class="mt-3 text-center"><a th:href="@{/login}">Déjà un compte ?</a></p>
  </div></div>
</div>
</body>
</html>
