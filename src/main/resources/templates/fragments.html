<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title} + ' - TTGEO'">TTGEO</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav th:fragment="nav" class="navbar navbar-expand navbar-dark bg-primary px-3">
  <a class="navbar-brand" th:href="@{/sites}">TTGEO</a>
  <ul class="navbar-nav me-auto">
    <li class="nav-item"><a class="nav-link" th:href="@{/sites}">Sites</a></li>
    <li class="nav-item" sec:authorize="hasRole('ADMIN')"><a class="nav-link" th:href="@{/users}">Utilisateurs</a></li>
    <li class="nav-item"><a class="nav-link" th:href="@{/profile}">Profil</a></li>
  </ul>
  <form th:action="@{/logout}" method="post" class="d-flex">
    <span class="navbar-text me-3" sec:authentication="name"></span>
    <button class="btn btn-light btn-sm">Déconnexion</button>
  </form>
</nav>
</body>
</html>
