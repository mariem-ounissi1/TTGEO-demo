<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Utilisateur')}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<div class="container mt-4" style="max-width:500px">
  <h3>Modifier l'utilisateur</h3>
  <form th:action="@{/users/save/{id}(id=${user.id})}" method="post">
    <div class="mb-3"><label class="form-label">Email</label><input class="form-control" th:value="${user.email}" disabled></div>
    <div class="mb-3"><label class="form-label">Nom</label><input name="nom" class="form-control" th:value="${user.nom}" required></div>
    <div class="mb-3"><label class="form-label">Rôle</label>
      <select name="role" class="form-select">
        <option value="USER" th:selected="${user.role == 'USER'}">USER</option>
        <option value="ADMIN" th:selected="${user.role == 'ADMIN'}">ADMIN</option>
      </select></div>
    <button class="btn btn-primary">Enregistrer</button>
    <a class="btn btn-secondary" th:href="@{/users}">Annuler</a>
  </form>
</div>
</body>
</html>
