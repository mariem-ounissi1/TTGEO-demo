<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Nouvel utilisateur')}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<div class="container mt-4" style="max-width:500px">
  <h3>Ajouter un utilisateur</h3>
  <form th:action="@{/users/create}" th:object="${user}" method="post">
    <div class="mb-3"><label class="form-label">Nom</label>
      <input th:field="*{nom}" class="form-control">
      <div class="text-danger small" th:if="${#fields.hasErrors('nom')}" th:errors="*{nom}"></div></div>
    <div class="mb-3"><label class="form-label">Email</label>
      <input th:field="*{email}" class="form-control">
      <div class="text-danger small" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div></div>
    <div class="mb-3"><label class="form-label">Mot de passe</label>
      <input type="password" th:field="*{password}" class="form-control">
      <div class="text-danger small" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div></div>
    <div class="mb-3"><label class="form-label">Rôle</label>
      <select name="role" class="form-select">
        <option value="USER">USER</option>
        <option value="ADMIN">ADMIN</option>
      </select></div>
    <button class="btn btn-primary">Enregistrer</button>
    <a class="btn btn-secondary" th:href="@{/users}">Annuler</a>
  </form>
</div>
</body>
</html>
